name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[dev,tui]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade build cyclonedx-py
      - name: Build sdist + wheel
        run: python -m build
      - name: Generate SHA256SUMS + per-asset sidecars
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          for f in *; do
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          cat SHA256SUMS
      - name: Generate SBOM (CycloneDX)
        run: |
          cyclonedx-py environment -o dist/sbom.cyclonedx.json --sv 1.5 \
            "$(which python)" || \
            echo "::warning::SBOM generation skipped (cyclonedx-py unavailable)"
      - name: Generate release manifest
        run: |
          python -c "
          import hashlib, json, pathlib, sys
          dist = pathlib.Path('dist')
          manifest = {'version': '${{ github.ref_name }}', 'artifacts': {}}
          for f in sorted(dist.iterdir()):
              if f.is_file() and f.name != 'release-manifest.json':
                  manifest['artifacts'][f.name] = hashlib.sha256(f.read_bytes()).hexdigest()
          manifest['source_archive_url'] = 'https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz'
          manifest['release_assets_base'] = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}'
          pathlib.Path('dist/release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(manifest, indent=2))
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
            dist/*.sha256
            dist/sbom.cyclonedx.json
            dist/release-manifest.json

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download just-built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify checksums, then install from wheel (no PyPI)
        run: |
          set -eu
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install --upgrade pip --quiet
          /tmp/clean/bin/python -m pip install "$(ls dist/*.whl)[tui]"
      - name: Smoke test the installed entry point
        run: |
          /tmp/clean/bin/prometheus --help
          /tmp/clean/bin/prometheus doctor
      - name: Bootstrap smoke test (public install.sh against this tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOME: /tmp/bs-home
        run: |
          set -eu
          mkdir -p "$HOME"
          PROMETHEUS_VERSION="$GITHUB_REF_NAME" \
          PROMETHEUS_INSTALL_ROOT="$HOME/.local/share/prometheus" \
          PROMETHEUS_BIN="$HOME/.local/bin" \
          sh install.sh --yes --no-ollama --no-tui
          "$HOME/.local/bin/prometheus" --help
