name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,tui]"
      - run: ruff check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,tui]"
      - name: Configure CI environment (Linux)
        if: runner.os == 'Linux'
        run: |
          git config --global user.email "ci@prometheus.local"
          git config --global user.name "PROMETHEUS CI"
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Configure CI environment (non-Linux)
        if: runner.os != 'Linux'
        run: |
          git config --global user.email "ci@prometheus.local"
          git config --global user.name "PROMETHEUS CI"
      - run: pytest -q

  package-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,tui]" build
      - run: pytest -q tests/test_package_resources.py tests/test_installed_defaults.py tests/test_wheel_contains_resources.py tests/test_bundles_without_repo_checkout.py

  tui-no-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,tui]"
      - run: pytest -q tests/test_tui_no_raw_markup.py tests/test_tui_raw_markup_export.py tests/test_tui_visual_smoke.py tests/test_tui_no_empty_debug_panel.py

  bundleforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,tui]"
      - run: pytest -q tests/test_model_catalog.py tests/test_bundleforge_schema.py tests/test_bundleforge_wizard.py tests/test_bundleforge_recommendations.py tests/test_bundleforge_validation.py tests/test_bundleforge_install_export.py tests/test_bundleforge_capability_matching.py

  clean-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,tui]" build
      - run: bash scripts/clean_install_defaults_smoke.sh

  test-wsl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
      - run: |
          wsl bash -lc "
            python3 -m pip install --user -e '.[dev,tui]' &&
            python3 -m pytest -q
          "
