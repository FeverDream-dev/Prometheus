name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,tui]"
      - run: ruff check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,tui]"
      - name: Configure CI environment (Linux)
        if: runner.os == 'Linux'
        run: |
          git config --global user.email "ci@prometheus.local"
          git config --global user.name "PROMETHEUS CI"
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
      - name: Configure CI environment (non-Linux)
        if: runner.os != 'Linux'
        run: |
          git config --global user.email "ci@prometheus.local"
          git config --global user.name "PROMETHEUS CI"
      - run: pytest -q

  test-wsl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v3
        with:
          distribution: Ubuntu-22.04
      - run: |
          wsl bash -lc "
            python3 -m pip install --user -e '.[dev,tui]' &&
            python3 -m pytest -q
          "
