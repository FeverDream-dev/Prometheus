[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-local-agent"
version = "0.1.1"
description = "Local-first adaptive multi-model coding agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Prometheus Community and Commercial License" }
authors = [{ name = "PROMETHEUS Contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.9"]
tui = ["textual>=1.0,<2"]
browser = ["playwright>=1.40,<2"]

[project.scripts]
prometheus = "prometheus_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prometheus_cli = [
    "resources/*.yaml",
    "resources/*.json",
    "resources/bundles_v2/*.yaml",
    "resources/bundles_v1/*.yaml",
    "resources/prompts/*",
    "resources/schemas/*",
    "resources/i18n/*",
    "resources/agents/*",
    "resources/model_catalog/*.yaml",
    "resources/bundleforge/*.yaml",
    "resources/mcp_templates/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]

[tool.ruff]
line-length = 100
