<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="PROMETHEUS — local-first multi-model coding agent">
  <!--
    PROVISIONAL SOCIAL CARD. Original inline SVG mark, not the official company
    logo (pending). Social scrapers prefer PNG/JPG; this SVG is the honest
    self-contained choice (no external fonts/images/CDN). Replace with a real
    raster card when brand artwork is supplied.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15110f"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.06" r="0.6">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e0451b"/>
      <stop offset="0.55" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- spark mark -->
  <g transform="translate(96 226) scale(3.6)">
    <path d="M8 5 H4 V27 H8" fill="none" stroke="#ff7a18" stroke-width="2.4" stroke-linecap="square"/>
    <path d="M24 5 H28 V27 H24" fill="none" stroke="#ff7a18" stroke-width="2.4" stroke-linecap="square"/>
    <path d="M16 5 C 12.5 9.5, 11 12.5, 11 16.5 C 11 20.5, 13 23.5, 16 24.8 C 19 23.5, 21 20.5, 21 16.5 C 21 13.5, 19.2 11, 17.4 8.6 C 18 11, 17.4 13.2, 16 13.2 C 14.7 12.8, 14.8 9.2, 16 5 Z" fill="url(#flame)"/>
    <path d="M16 15.5 C 14.8 17, 14.4 18.6, 15 20 C 15.5 21, 16.5 21, 17 20 C 17.6 18.6, 17.2 17, 16 15.5 Z" fill="#fff3e0" opacity="0.9"/>
  </g>

  <text x="252" y="298" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="86" font-weight="700" letter-spacing="6" fill="#f5ece1">PROMETHEUS</text>
  <text x="256" y="356" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="30" letter-spacing="3" fill="#ff7a18">LOCAL-FIRST · MULTI-MODEL · EVIDENCE-DRIVEN</text>
  <text x="256" y="408" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#b8ac9e">A private coding agent that runs on your hardware.</text>

  <text x="96" y="560" font-family="ui-monospace, Menlo, monospace" font-size="24" letter-spacing="2" fill="#8f8579">FeverDream-dev/Prometheus · Ollama default · cloud optional · no telemetry</text>
</svg>
