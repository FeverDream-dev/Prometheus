schema_version: 2
id: forge-12gb
name: Forge — 12 GB balanced
description: Strong multimodal local controller with a hot-swapped compact reviewer.
recommended_for: [medium repositories, frontend/backend work, browser screenshots]
hardware:
  minimum_ram_gb: 16
  recommended_ram_gb: 24
  minimum_vram_gb: 10
  recommended_vram_gb: 12
  minimum_free_disk_gb: 14
runtime:
  provider: ollama
  minimum_version: 0.13.3
  sequential_loading: true
  maximum_loaded_models: 1
  default_context: 16384
  context_ceiling: 32768
  unlimited_local_sessions: true
roles:
  controller:
    model: qwen3.5:9b
    approximate_download_gb: 6.6
    capabilities: [text, image, tools, thinking, coding, json]
    keep_alive: 10m
  reviewer:
    model: granite4.1:3b
    approximate_download_gb: 2.1
    capabilities: [text, tools, json, coding]
    keep_alive: 0
  embedding:
    model: qwen3-embedding:0.6b
    approximate_download_gb: 0.7
    capabilities: [embeddings]
    optional: true
    keep_alive: 0
licenses:
  - model: qwen3.5:9b
    license: verify-at-install
    source: https://ollama.com/library/qwen3.5
  - model: granite4.1:3b
    license: Apache-2.0
    source: https://ollama.com/library/granite4.1
  - model: qwen3-embedding:0.6b
    license: verify-at-install
    source: https://ollama.com/library/qwen3-embedding
qualification:
  required: [chat, image, structured_output, single_tool, parallel_tool, multi_turn_tool, code_patch, repository_navigation, test_repair]
experimental: false
