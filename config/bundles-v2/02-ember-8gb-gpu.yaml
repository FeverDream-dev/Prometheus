schema_version: 2
id: ember-8gb-gpu
name: Ember — 8 GB GPU
description: One compact multimodal controller for coding, tools, reasoning, and screenshots.
recommended_for: [general coding, small web projects, screenshot interpretation]
hardware:
  minimum_ram_gb: 12
  recommended_ram_gb: 16
  minimum_vram_gb: 6
  recommended_vram_gb: 8
  minimum_free_disk_gb: 8
runtime:
  provider: ollama
  minimum_version: 0.13.3
  sequential_loading: true
  maximum_loaded_models: 1
  default_context: 8192
  context_ceiling: 16384
  unlimited_local_sessions: true
roles:
  controller:
    model: qwen3.5:4b
    approximate_download_gb: 3.4
    capabilities: [text, image, tools, thinking, coding, json]
    keep_alive: 10m
  reviewer:
    model: granite4.1:3b
    approximate_download_gb: 2.1
    capabilities: [text, tools, json, coding]
    optional: true
    keep_alive: 0
licenses:
  - model: qwen3.5:4b
    license: verify-at-install
    source: https://ollama.com/library/qwen3.5
  - model: granite4.1:3b
    license: Apache-2.0
    source: https://ollama.com/library/granite4.1
qualification:
  required: [chat, image, structured_output, single_tool, parallel_tool, multi_turn_tool, code_patch, test_repair]
experimental: false
