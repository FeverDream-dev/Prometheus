schema_version: 2
id: vibethinker-sandbox-q2
name: VibeThinker Sandbox Q2
description: >
  Smallest practical local reasoning model for proving PROMETHEUS sandbox,
  tool-execution, and bounded-memory orchestration with real Ollama inference.
  PROMETHEUS owns the deterministic tool loop; VibeThinker proposes structured
  JSON recommendations that are validated by Pydantic before any tool call.
  Smoke-test grade, not production coding quality.
recommended_for: [sandbox smoke tests, real-inference proof, CI on 8 GB hosts]
hardware:
  minimum_ram_gb: 8
  recommended_ram_gb: 12
  minimum_vram_gb: 0
  minimum_free_disk_gb: 4
runtime:
  provider: ollama-huggingface-gguf
  minimum_version: latest-qualified
  sequential_loading: true
  maximum_loaded_models: 1
  default_context: 4096
  context_ceiling: 16384
  unlimited_local_sessions: true
roles:
  controller:
    model: hf.co/prithivMLmods/VibeThinker-3B-GGUF:Q2_K
    approximate_download_gb: 1.27
    capabilities: [text, reasoning]
    prohibited_capabilities: [tools]
    keep_alive: 0
  reviewer:
    model: hf.co/prithivMLmods/VibeThinker-3B-GGUF:Q2_K
    approximate_download_gb: 0
    capabilities: [text, reasoning]
    prohibited_capabilities: [tools]
    keep_alive: 0
    optional: true
licenses:
  - model: WeiboAI/VibeThinker-3B
    license: MIT
    source: https://huggingface.co/WeiboAI/VibeThinker-3B
  - model: prithivMLmods/VibeThinker-3B-GGUF
    license: verify-community-quantization
    source: https://huggingface.co/prithivMLmods/VibeThinker-3B-GGUF
qualification:
  required: [chat, reasoning, structured_output, no_tool_call_enforcement]
experimental: true
upgrade: vibethinker-sandbox-q4 for higher quality at ~1.93 GB when disk/VRAM allow.
